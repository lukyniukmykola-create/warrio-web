<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warrio — promo v3</title><meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<link rel="stylesheet" href="promo3.css?v=1"></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="mbA" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="mbAg" stdDeviation="0 0"/></filter>
  <filter id="mbB" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="mbBg" stdDeviation="0 0"/></filter>
</defs></svg>
<div id="stage">
  <div id="bg"><img class="silk s1" src="silk.jpg" alt=""><img class="silk s2" src="silk.jpg" alt=""><i class="vig"></i></div>
  <canvas id="dust" width="960" height="540"></canvas>
  <div id="brand"><svg id="mark" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#e2d9ff"/><stop offset="1" stop-color="#7a63ff"/></linearGradient></defs><path fill="url(#g)" d="M11 16.8 27.4 8l12.1 7.1-5.2 11.4 9.2 21.2-14 8.3L12.7 45.8 7.5 27.2 11 16.8Z"/><path fill="#9a86ff" d="m39.1 8 13.8 7.9 3.6 12.4-8.9 7-8.5-19.1V8Z"/></svg><span id="word"></span></div>
  <div id="chips"></div>
  <svg id="cursor" viewBox="0 0 24 24" width="34" height="34"><path d="M4 2l15 8.5-6.6 1.6 3.9 7-2.7 1.5-3.9-7L5 18z" fill="#fff" stroke="#120a33" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div id="code"><pre><span class="k">await</span> warrio.sales.<span class="f">register</span>({
  serial: <span class="s">"N600-26-00201"</span>,
  dealer: <span class="s">"Klimat Plus"</span>,
  model:  <span class="s">"NAVI 600"</span>,
})</pre></div>
  <div id="glow"></div>
  <div id="hero">
    <div id="card" class="glass">
      <div class="ph1" id="ph1">
        <div class="ph"><b>New sale</b><span class="pill v">Pending buyer</span></div>
        <div class="row"><span>Dealer</span><b>Klimat Plus</b></div>
        <div class="row"><span>Model</span><b>NAVI 600</b></div>
        <div class="row"><span>Serial</span><b>N600-26-00201</b></div>
      </div>
      <div class="ph2" id="ph2">
        <div class="qrcol"><div class="qr" id="qr"></div></div>
        <div class="info"><div class="ph"><b>Warranty active</b></div><div class="big">3 years</div><div class="row"><span>Valid until</span><b>19.11.2029</b></div><div class="row"><span>Number</span><b>WRR-2026-004821</b></div></div>
        <div class="pdf" id="pdf">PDF</div><div class="mail" id="mail">✉</div>
        <div class="okpill" id="okp"><i>✓</i> Sent to buyer</div>
      </div>
    </div>
  </div>
  <div id="prompt" class="glass"><span class="plus">+</span><span id="ptext"></span><i id="pcaret"></i><b class="send">↑</b></div>
  <div id="end"><svg id="emark" viewBox="0 0 64 64"><defs><linearGradient id="g3" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#e8e0ff"/><stop offset="1" stop-color="#8d78ff"/></linearGradient></defs><path fill="url(#g3)" d="M11 16.8 27.4 8l12.1 7.1-5.2 11.4 9.2 21.2-14 8.3L12.7 45.8 7.5 27.2 11 16.8Z"/><path fill="#a794ff" d="m39.1 8 13.8 7.9 3.6 12.4-8.9 7-8.5-19.1V8Z"/></svg><div id="slogan"></div><div id="ename"></div></div>
</div>
<script src="promo3.js?v=1"></script>
</body></html>
